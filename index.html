<body style="margin: 0;background-color: #000;display: grid;place-items: center;height: 100%;">
<style>
    #tmpl {
        text-shadow: 1px 1px 2px #000;
        font: 20px 'Arial Black';
        opacity: 0.5;
        aspect-ratio: 16/9;
        color: white;
        user-select: none;
    }

    #tmpl,#c3d {
        width: min(100vw, calc(100vh * 16/9));
        position: absolute;
    }

    #bonus{position: absolute; bottom: 10px; text-align: center; width: 100%; font-size: 40px;}

    .s {
        position: absolute;
        top: 20px;
        text-align: right;
        right: 40px;
        font-size: 30px;
    }

    .u {
        position:absolute;
        left:20px;
        top:10%;
        height:80%;
        width:20px;
        border:1px solid;
        box-shadow:1px 1px 2px #000;
    }

    #pwr {
        position:absolute;
        bottom:0;
        background-size: cover;
        width:100%
    }

    .m{
        position: absolute;
        width:100%;
        border-top:1px solid;
        text-indent:30px;
        line-height: 0;
    }
</style>
<canvas id="c3d" width="1920" height="1080"></canvas>
<div id="tmpl">
    <div class="s">
<!--        <div id="hisc"></div>-->
        <div id="score"></div>
    </div>

    <div class="u">
        <div id="pwr"></div>
        <div class="m" style="bottom: 20%">x2</div>
        <div class="m" style="bottom: 40%">&#9678;+</div>
        <div class="m" style="bottom: 60%">x3</div>
        <div class="m" style="bottom: 80%">x4</div>
        <div class="m" style="bottom: 100%">&#9678;+</div>
    </div>

    <div id="bonus"></div>
</div>

<script type="module" src="/src/index.ts"></script>
</body>
