<body style="margin: 0;background-color: black;display: grid;place-items: center;height: 100%; overflow: hidden;font-family:serif;">
<style>
    .areas{display:flex;gap:6px; position: absolute; bottom: 100px;}
    .areas span{
        width: 90px;
        height: 25px;
        background:#555;
        border: 1px solid #ccc;
        position: relative;
    }

    .areas b:after{
        content: attr(data-p);
        position:absolute;
        font-size: 22px;
        width: 90px;
        text-align: center;
        color: white;
        text-shadow: 1px 1px 2px black;
        font-weight: 100;
    }

    .areas b{
        display:block;
        height:100%;
    }
</style>
<canvas id="c3d" width="1920" height="1080" style="width: min(100vw, calc(100vh * 16/9));position: absolute;aspect-ratio: 16/9;color: white;"></canvas>
<div id="tmpl" style="width: min(100vw, calc(100vh * 16/9));position: absolute;aspect-ratio: 16/9;color: white; font-size: 35px; user-select: none">
<!--    <h1 id="msg" style="text-align: center">Click to Start</h1>-->
</div>

<div class="areas">
    <span><b id="uir" style="background-color: red;"></b></span>
    <span><b id="uiy" style="background-color: yellow;"></b></span>
    <span><b id="uig" style="background-color: green;"></b></span>
    <span><b id="uib" style="background-color: blue;"></b></span>
    <span><b id="uip" style="background-color: purple"></b></span>
</div>

<script type="module" src="/src/index.ts"></script>
</body>
