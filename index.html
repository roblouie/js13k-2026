<body style="margin: 0;background-color: black;display: grid;place-items: center;height: 100%; overflow: hidden;font-family:'Arial Black'">
<style>
    .areas{display:flex;gap:6px; position: absolute; bottom: 100px;color: white; font-size: 40px;}
    .areas span{
        width: 90px;
        height: 25px;
        background:#555;
        border: 1px solid #ccc;
        position: relative;
    }

    #score {
        position: absolute;
        top: 20px;
        text-align: right;
        right: 40px;
        color: white;
        text-shadow: 1px 1px 2px black;
        font-size: 30px;
        font-weight: bold;
        opacity: 0.3;
    }

    .unicorn-power-meter {
        position: absolute;
        left: 20px;
        height: 80%;
        top: 10%;
        width: 20px;
        border: 1px solid white;
        display: flex;
        align-items: flex-end;
        opacity: 0.4;
        box-shadow: 1px 1px 2px black;
        text-shadow: 1px 1px 2px black;
    }

    .unicorn-power {
        background-color: blue;
        width: 100%;
    }

    .upgrade-marker {
        width: 100%;
        background-color: white;
        position: absolute;
        height: 1px;
        color: white;

        div {
            position: relative;
            left: 30px;
            top: -10px;
            font-size: 20px;
        }
    }
</style>
<canvas id="c3d" width="1920" height="1080" style="width: min(100vw, calc(100vh * 16/9));position: absolute;aspect-ratio: 16/9;color: white; background-color:purple"></canvas>
<div id="tmpl" style="width: min(100vw, calc(100vh * 16/9));position: absolute;aspect-ratio: 16/9;color: white; font-size: 35px; user-select: none">
    <div id="score">SCORE 2000</div>

    <!--    <h1 id="msg" style="text-align: center">Click to Start</h1>-->
    <div class="unicorn-power-meter">
        <div id="pwr" class="unicorn-power"></div>
        <div class="upgrade-marker" style="bottom: 20%"><div>&#215;2</div></div>
        <div class="upgrade-marker" style="bottom: 40%"><div>&#9678;+</div></div>
        <div class="upgrade-marker" style="bottom: 60%"><div>&#215;3</div></div>
        <div class="upgrade-marker" style="bottom: 80%"><div>&#215;4</div></div>
        <div class="upgrade-marker" style="bottom: 100%"><div>&#9678;+</div></div>

    </div>
</div>


<div class="areas">
    2x SCORE
