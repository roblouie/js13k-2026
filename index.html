<body style="margin: 0;background-color: black;display: grid;place-items: center;height: 100%; overflow: hidden;font-family:'Arial Black'">
<style>
    #tmpl {
        text-shadow: 1px 1px 2px black;
        font-size: 20px;
        opacity: 0.3;
        width: min(100vw, calc(100vh * 16/9));
        position: absolute;
        aspect-ratio: 16/9;
        color: white;
        user-select: none;
    }

    #bonus{position: absolute; bottom: 10px;color: white; text-align: center; width: 100%; font-size: 40px; text-transform: uppercase}

    .s {
        position: absolute;
        top: 20px;
        text-align: right;
        right: 40px;
        color: white;
        font-size: 30px;
    }

    .u {
        position: absolute;
        left: 20px;
        height: 80%;
        top: 10%;
        width: 20px;
        border: 1px solid white;
        display: flex;
        align-items: flex-end;
        box-shadow: 1px 1px 2px black;
    }

    #pwr {
        background-color: blue;
        width: 100%;
    }

    .m {
        width: 100%;
        background-color: white;
        position: absolute;
        height: 1px;
        color: white;

        div {
            position: relative;
            left: 30px;
            top: -10px;
        }
    }

    .b {
        position: absolute;
        bottom: 10px;
        left: 20px;
    }
</style>
<canvas id="c3d" width="1920" height="1080" style="width: min(100vw, calc(100vh * 16/9));position: absolute;"></canvas>
<div id="tmpl">
    <div class="s">
        <div id="hisc"></div>
        <div id="score"></div>
    </div>

    <div class="u">
        <div id="pwr"></div>
        <div class="m" style="bottom: 20%"><div>&#215;2</div></div>
        <div class="m" style="bottom: 40%"><div>&#9678;+</div></div>
        <div class="m" style="bottom: 60%"><div>&#215;3</div></div>
        <div class="m" style="bottom: 80%"><div>&#215;4</div></div>
        <div class="m" style="bottom: 100%"><div>&#9678;+</div></div>
    </div>

    <div class="b">
        <div id="scmul"></div>
        <div id="radpls"></div>
    </div>

    <div id="bonus"></div>
</div>

<script type="module" src="/src/index.ts"></script>
</body>
